      }).join("");
      const memories = Array.isArray(fields.memories) ? fields.memories.filter(memory => memory.image || String(memory.note || "").trim()) : [];
      const visibleMemories = memories.filter(memory => !publicView || !memory.secret);
      const memoriesSection = visibleMemories.length ? `<section class="viewer-section"><h3>思い出</h3><div class="viewer-memories">${visibleMemories.map((memory, index) => {       const relatedPeople = (memory.relatedPeople || []).map(id => character.relationships.find(person => person.id === id)).filter(person => person && (!publicView || !isSecretRelationship(person))); return `<article class="viewer-memory">${memory.image ? `<img src="${escapeHtml(memory.image)}" alt="思い出 ${index + 1}">` : ""}${memory.note ? `<p>${escapeHtml(memory.note)}</p>` : ""}${relatedPeople.length ? `<div class="viewer-memory-people">関係する人: ${relatedPeople.map(person => escapeHtml(person.name || "名前未設定")).join("、")}</div>` : ""}</article>`; }).join("")}</div></section>` : "";
      const visibleRelationships = character.relationships.filter(person => !publicView || !isSecretRelationship(person));
      const relationshipSection = visibleRelationships.length ? `<section class="viewer-section"><h3>人間関係</h3><div class="viewer-relationship-list">${visibleRelationships.map((person, index) => {
        const details = [["relationship", "関係性"], ["meeting", "出会い"], ["impression", "印象"], ["feelings", "相手をどう思っているか"], ["memo", "エピソード・メモ"]].filter(([key]) => String(person[key] || "").trim());
        const target = linkedRelationshipTarget(person);
        const linkedName = linkedRelationshipName(person);
        const isLinked = person.characterId || person.npcId || person.otherCharacterId;
        const linkedTypeName = target.type === "npc" ? "NPC" : target.type === "other" ? "他キャラ図書館" : "キャラクター";
        return `<article class="viewer-person"><div class="viewer-person-top"><h4>${escapeHtml(person.name || `人物 ${index + 1}`)}</h4>${linkedRelationshipPortrait(person)}</div>${target.item ? `<p class="viewer-linked-character">${linkedTypeName}: ${escapeHtml(linkedName || "名前未設定")}</p>` : isLinked ? `<p class="viewer-linked-character">${linkedTypeName}: 削除済み</p>` : ""}${details.length ? `<dl class="viewer-fields">${details.map(([key, label]) => `<div class="viewer-field"><dt>${label}</dt><dd>${escapeHtml(person[key])}</dd></div>`).join("")}</dl>` : ""}</article>`;
      }).join("")}</div></section>` : "";
      main.innerHTML = `<article class="viewer" style="--character-color:${characterColor(character)}"><header class="viewer-title"><div class="viewer-heading"><h2>${escapeHtml(fields.name || "名前未設定")}</h2>${fields.profession || fields.class ? `<p>${[fields.profession, fields.class].filter(Boolean).map(escapeHtml).join(" / ")}</p>` : ""}</div><div class="viewer-copy-actions"><button class="button" type="button" data-action="copy-profile" data-include-secrets="false">通常コピー</button><button class="button" type="button" data-action="copy-profile" data-include-secrets="true">秘匿込みコピー</button></div></header>${sections || memoriesSection ? "" : `<p class="viewer-empty">まだプロフィール情報がありません。</p>`}${sections}${memoriesSection}${relationshipSection}</article>`;
    }

    function filterSecretText(value, includeSecrets) {
      return String(value ?? "").replace(/“([\s\S]*?)”|”([\s\S]*?)”|"([\s\S]*?)"/g, (match, curlyOpen, curlySame, straight) => {
        const secret = curlyOpen ?? curlySame ?? straight;
        return includeSecrets ? secret : "";
      }).replace(/[ \t]{2,}/g, " ").replace(/ *\n */g, "\n").trim();
    }

    function profileAsText(character, includeSecrets) {
      const fields = character.fields || {};
      const visible = value => filterSecretText(value, includeSecrets).trim();
      const lines = [visible(fields.name) || "名前未設定"];
      const profession = visible(fields.profession);
      const characterClass = visible(fields.class);
      if (profession || characterClass) lines.push([profession, characterClass].filter(Boolean).join(" / "));
      lines.push("");
      for (const group of groups) {
        const populated = group.fields.filter(([, , type]) => type !== "memories").map(([key, label, type]) => [key, label, type === "scenarios" ? (Array.isArray(fields[key]) ? fields[key].map(visible).filter(Boolean).join("、") : "") : type === "handouts" ? scenarioHandoutText(fields, includeSecrets) : visible(fields[key])]).filter(([, , value]) => value);
        if (!populated.length) continue;
        lines.push(`【${group.title}】`);
        for (const [, label, value] of populated) lines.push(`${label}: ${value}`);
        lines.push("");
      }
      const memoryNotes = (Array.isArray(fields.memories) ? fields.memories : []).map(memory => {
        if (memory.secret && !includeSecrets) return "";
        const note = visible(memory.note);
        const relatedNames = (memory.relatedPeople || []).map(id => character.relationships.find(person => person.id === id)).filter(person => person && (includeSecrets || !isSecretRelationship(person))).map(person => visible(person.name)).filter(Boolean);
        const relatedText = relatedNames.length ? `関係する人: ${relatedNames.join("、")}` : "";
        return [note, relatedText].filter(Boolean).join("\n");
      }).filter(Boolean);
      if (memoryNotes.length) {
        lines.push("【思い出】", ...memoryNotes, "");
      }
      if (character.relationships.length) {
        const people = character.relationships.filter(person => includeSecrets || !isSecretRelationship(person)).map((person, index) => ({
          name: visible(person.name),
          fallbackName: `人物 ${index + 1}`,
          details: [["relationship", "関係性"], ["meeting", "出会い"], ["impression", "印象"], ["feelings", "相手をどう思っているか"], ["memo", "エピソード・メモ"]].map(([key, label]) => [label, visible(person[key])]).filter(([, value]) => value)
        })).filter(person => person.name || person.details.length);
        if (people.length) lines.push("【人間関係】");
        people.forEach(person => {
          lines.push(person.name || person.fallbackName);
          for (const [label, value] of person.details) lines.push(`${label}: ${value}`);
          lines.push("");
        });
      }
      return lines.join("\n").trim();
    }

    function copyMemoryForCharacter(memory, sourceCharacter) {
      const relatedPeopleNames = (memory.relatedPeople || []).map(id => sourceCharacter.relationships.find(person => person.id === id)?.name).filter(Boolean);
      const relatedPeople = (memory.relatedPeople || []).map(id => {
        const sourcePerson = sourceCharacter.relationships.find(person => person.id === id);
        const targetCharacter = characters.find(item => item.id === sourcePerson?.characterId);
        return targetCharacter?.relationships.find(person => person.reciprocalRelationshipId === id)?.id;
      }).filter(Boolean);
      return {
        id: `${memory.id}:${sourceCharacter.id}`,
        sharedMemoryId: memory.id,
        sharedSourceCharacterId: sourceCharacter.id,
        image: memory.image || "",
        note: memory.note || "",
        secret: Boolean(memory.secret),
        relatedPeopleNames,
        relatedPeople
      };
    }

    function memorySource(character, memory) {
      if (memory.sharedMemoryId && memory.sharedSourceCharacterId) {
        const sourceCharacter = characters.find(item => item.id === memory.sharedSourceCharacterId);
        const sourceMemory = sourceCharacter?.fields.memories?.find(item => item.id === memory.sharedMemoryId);
        if (sourceCharacter && sourceMemory) return { character: sourceCharacter, memory: sourceMemory };
      }
      return { character, memory };
    }

    async function updateSharedMemory(character, memory, changes) {
      const source = memorySource(character, memory);
      Object.assign(source.memory, changes);
      await syncSharedMemory(source.character, source.memory);
    }

    async function updateSharedMemoryPerson(character, memory, localPersonId, checked) {
      const source = memorySource(character, memory);
      const localPerson = character.relationships.find(person => person.id === localPersonId);
      const sourcePersonId = memory.sharedMemoryId ? localPerson?.reciprocalRelationshipId : localPersonId;
      if (!sourcePersonId) return;
      source.memory.relatedPeople ||= [];
      if (checked && !source.memory.relatedPeople.includes(sourcePersonId)) source.memory.relatedPeople.push(sourcePersonId);
      else if (!checked) source.memory.relatedPeople = source.memory.relatedPeople.filter(id => id !== sourcePersonId);
      if (source.character === character && !memory.sharedMemoryId) {
        source.memory.sharedWithCharacterIds ||= [];
        const linkedCharacterId = localPerson.characterId;
        if (linkedCharacterId && checked && !source.memory.sharedWithCharacterIds.includes(linkedCharacterId)) source.memory.sharedWithCharacterIds.push(linkedCharacterId);
        if (linkedCharacterId && !checked) source.memory.sharedWithCharacterIds = source.memory.sharedWithCharacterIds.filter(id => id !== linkedCharacterId);
      }
      await syncSharedMemory(source.character, source.memory);
    }

    async function syncSharedMemory(character, memory) {
      const source = memorySource(character, memory);
      const sourceCharacter = source.character;
      const sourceMemory = source.memory;
      sourceMemory.id ||= crypto.randomUUID();
      sourceMemory.sharedWithCharacterIds ||= [...new Set((sourceMemory.relatedPeople || []).map(id => sourceCharacter.relationships.find(person => person.id === id)?.characterId).filter(id => id && id !== sourceCharacter.id))];
      const linkedIds = new Set(sourceMemory.sharedWithCharacterIds.filter(id => id !== sourceCharacter.id));
      const writes = [];
      for (const target of characters) {
        if (target.id === sourceCharacter.id) continue;
        target.fields.memories ||= [];
        const mirrorIndex = target.fields.memories.findIndex(item => item.sharedMemoryId === sourceMemory.id && item.sharedSourceCharacterId === sourceCharacter.id);
        if (linkedIds.has(target.id)) {
          const mirror = copyMemoryForCharacter(sourceMemory, sourceCharacter);
          if (mirrorIndex === -1) target.fields.memories.push(mirror);
          else target.fields.memories[mirrorIndex] = mirror;
          writes.push(writeCharacter(target));
        } else if (mirrorIndex !== -1) {
          target.fields.memories.splice(mirrorIndex, 1);
          writes.push(writeCharacter(target));
        }
      }
      writes.push(writeCharacter(sourceCharacter));
      await Promise.all(writes);
      return sourceMemory;
    }

    async function removeSharedMemory(character, memory) {
      if (!memory.sharedMemoryId || !memory.sharedSourceCharacterId) {
        character.fields.memories = character.fields.memories.filter(item => item !== memory);
        return;
      }
      const sourceId = memory.sharedSourceCharacterId;
      const sharedId = memory.sharedMemoryId;
      const writes = [];
      for (const item of characters) {
        const before = item.fields.memories?.length || 0;
        item.fields.memories = (item.fields.memories || []).filter(entry => !(item.id === sourceId ? entry.id === sharedId : entry.sharedMemoryId === sharedId && entry.sharedSourceCharacterId === sourceId));
        if (item.fields.memories.length !== before) writes.push(writeCharacter(item));
      }
      await Promise.all(writes);
    }

    async function copyProfile(character, includeSecrets) {
      const text = profileAsText(character, includeSecrets);
      try {
        if (navigator.clipboard?.writeText) {
          await navigator.clipboard.writeText(text);
        } else {
          const temporary = document.createElement("textarea");
          temporary.value = text;
          temporary.style.position = "fixed";
          temporary.style.opacity = "0";
          document.body.append(temporary);
          temporary.select();
          const copied = document.execCommand("copy");
          temporary.remove();
          if (!copied) throw new Error("コピーできませんでした");
        }
        showToast(includeSecrets ? "秘匿内容を含めてコピーしました" : "通常内容をコピーしました");
      } catch (error) {
        showToast(`コピーできませんでした: ${error.message}`);
      }
    }

    function renderRelationships(character) {
      const container = document.getElementById("relations");
      if (!character.relationships.length) {
        container.innerHTML = `<div class="relation-empty">まだ人物が登録されていません。</div>`;
        return;
      }
      const linkableCharacters = characters.filter(item => item.id !== character.id);
      container.innerHTML = character.relationships.map((person, index) => {
        const selectedLink = person.npcId ? `npc:${person.npcId}` : person.otherCharacterId ? `other:${person.otherCharacterId}` : person.characterId ? `character:${person.characterId}` : "";
        const missingCharacter = person.characterId && !linkableCharacters.some(item => item.id === person.characterId);
        const missingNpc = person.npcId && !npcCharacters.some(item => item.id === person.npcId);
        const missingOtherCharacter = person.otherCharacterId && !otherCharacters.some(item => item.id === person.otherCharacterId);
        return `
        <article class="relation"><div class="relation-top"><div class="relation-controls"><button class="button icon danger" type="button" data-action="remove-person" data-index="${index}" aria-label="人物を削除" title="人物を削除">×</button></div></div>
          <div class="relation-identity"><div class="relation-identity-fields">
            <div class="relation-field"><label for="person-${index}-character">登録済みキャラクター（任意）</label><select id="person-${index}-character" data-person-character="${index}"><option value="" ${!selectedLink ? "selected" : ""}>紐づけなし</option>${missingCharacter ? `<option value="character:${escapeHtml(person.characterId)}" selected>削除済みキャラクター書庫の人物</option>` : ""}${missingNpc ? `<option value="npc:${escapeHtml(person.npcId)}" selected>削除済みNPC</option>` : ""}${missingOtherCharacter ? `<option value="other:${escapeHtml(person.otherCharacterId)}" selected>削除済み他キャラ図書館の人物</option>` : ""}${linkableCharacters.length ? `<optgroup label="キャラクター書庫">${linkableCharacters.map(item => `<option value="character:${escapeHtml(item.id)}"${selectedLink === `character:${item.id}` ? " selected" : ""}>${escapeHtml(item.fields?.name || "名前未設定")}</option>`).join("")}</optgroup>` : ""}${npcCharacters.length ? `<optgroup label="NPC（NPC登録・シナリオ内）" data-npc-options>${npcCharacters.map(item => `<option value="npc:${escapeHtml(item.id)}"${selectedLink === `npc:${item.id}` ? " selected" : ""}>${escapeHtml(item.fields?.name || "名前未設定")}</option>`).join("")}</optgroup>` : ""}${otherCharacters.length ? `<optgroup label="他キャラ図書館">${otherCharacters.map(item => `<option value="other:${escapeHtml(item.id)}"${selectedLink === `other:${item.id}` ? " selected" : ""}>${escapeHtml(item.name || "名前未設定")}</option>`).join("")}</optgroup>` : ""}</select></div>
            <div class="relation-field"><label for="person-${index}-name">相手</label><input id="person-${index}-name" data-person="${index}" data-person-field="name" value="${escapeHtml(person.name || "")}" autocomplete="off"></div>
          </div>${linkedRelationshipPortrait(person, "relation-portrait")}</div>
          <div class="relation-fields">
            ${[["relationship", "関係性", "textarea"], ["meeting", "出会い", "textarea"], ["impression", "印象", "textarea"], ["feelings", "相手をどう思っているか", "textarea"], ["memo", "エピソード・メモ", "textarea"]].map(([key, label, tag]) => `<div><label for="person-${index}-${key}">${label}</label><div class="writing-surface multiple"><textarea id="person-${index}-${key}" data-person="${index}" data-person-field="${key}" rows=2>${escapeHtml(person[key])}</textarea></div></div>`).join("")}
          </div></article>`;
      }).join("");
      container.querySelectorAll('input[data-person-field="name"]').forEach((input, index) => { input.value = character.relationships[index].name || ""; });
    }

    function refreshRelationshipNpcOptions() {
      document.querySelectorAll("#relations select[data-person-character]").forEach(select => {
        const selected = select.value;
        select.querySelector("[data-npc-options]")?.remove();
        if (npcCharacters.length) {
          const group = document.createElement("optgroup");
          group.label = "NPC（NPC登録・シナリオ内）";
          group.dataset.npcOptions = "";
          npcCharacters.forEach(npc => {
            const option = document.createElement("option");
            option.value = `npc:${npc.id}`;
            option.textContent = npc.fields?.name || "名前未設定";
            group.append(option);
          });
          select.append(group);
        }
        select.value = selected;
      });
    }

    function renderSecretControls(character) {
      main.querySelectorAll(".memory-entry").forEach((entry, index) => {
        const memory = character.fields.memories[index];
        const label = document.createElement("label");
        label.className = "secret-toggle";
        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.dataset.memorySecret = String(index);
        checkbox.checked = Boolean(memory.secret);
        label.append(checkbox, "秘匿として扱う");
        entry.querySelector(".memory-note").append(label);
      });
      renderRelationshipSecretControls(character);
    }

    function renderRelationshipSecretControls(character) {
      main.querySelectorAll(".relation").forEach((entry, index) => {
        const person = character.relationships[index];
        if (!person) return;
        const label = document.createElement("label");
        label.className = "secret-toggle";
        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.dataset.personSecret = person.id;
        checkbox.checked = Boolean(person.secret);
        label.append(checkbox, "秘匿として扱う");
        entry.querySelector(".relation-controls").append(label);
      });
    }

    function renderMemoryPeoplePickers(character) {
      main.querySelectorAll(".memory-people").forEach((list, index) => {
        const selectedCount = list.querySelectorAll('input[data-memory-person]:checked').length;
        const details = document.createElement("details");
        details.className = "memory-people-picker";
        const summary = document.createElement("summary");
        summary.textContent = `関係する人を選ぶ (${selectedCount})`;
        const options = document.createElement("div");
        options.className = "memory-people-options";
        options.setAttribute("aria-label", `思い出 ${index + 1} に関係する人`);
        while (list.firstChild) options.append(list.firstChild);
        details.append(summary, options);
        list.replaceWith(details);
      });
    }

    function renderScenarioPicker(character, values) {
      const selected = Array.isArray(values.passedScenarios) ? values.passedScenarios : [];
      const options = [...new Set([...scenarioOptions, ...selected])].sort((left, right) => left.localeCompare(right, "ja"));
      return `<details class="scenario-picker"><summary>シナリオを選ぶ (${selected.length})</summary><div class="scenario-options">${options.map((scenario, index) => `<label><input type="checkbox" data-passed-scenario="${escapeHtml(scenario)}" ${selected.includes(scenario) ? "checked" : ""}><span>${escapeHtml(scenario)}</span></label>`).join("") || `<small class="field-hint">NPC登録でシナリオ候補を追加できます。</small>`}</div></details><button class="button" type="button" data-action="add-scenario" style="margin-left:8px">＋ 候補を追加</button>${addingScenario ? `<div class="scenario-add-panel"><input id="newScenarioOption" type="text" placeholder="新しいシナリオ名" aria-label="追加するシナリオ名"><button class="button primary" type="button" data-action="save-scenario">追加</button><button class="button" type="button" data-action="cancel-scenario">取消</button></div>` : ""}`;
    }

    function normalizeScenarioHandouts(fields) {
      const saved = fields.scenarioHandouts;
      if (!saved || typeof saved !== "object" || Array.isArray(saved)) {
        fields.scenarioHandouts = {};
        return saved !== undefined;
      }
      let changed = false;
      const normalized = {};
      Object.entries(saved).forEach(([scenario, value]) => {
        const records = Array.isArray(value) ? value : typeof value === "string" && value.trim() ? [{ name: value }] : value && typeof value === "object" ? [value] : [];
        normalized[scenario] = records.filter(record => record && typeof record === "object").map(record => {
          const handout = {
            id: typeof record.id === "string" && record.id ? record.id : crypto.randomUUID(),
            name: typeof record.name === "string" ? record.name : "",
            characterRef: typeof record.characterRef === "string" ? record.characterRef : "",
            overview: typeof record.overview === "string" ? record.overview : "",
            content: typeof record.content === "string" ? record.content : "",
            result: typeof record.result === "string" ? record.result : "",
          };
          if (handout.id !== record.id || handout.name !== record.name || handout.characterRef !== record.characterRef || handout.overview !== record.overview || handout.content !== record.content || handout.result !== record.result) changed = true;
          return handout;
        });
        if (!Array.isArray(value)) changed = true;
      });
      fields.scenarioHandouts = normalized;
      return changed;
    }

    function scenarioHandoutRecords(fields) {
      const handouts = fields.scenarioHandouts && typeof fields.scenarioHandouts === "object" ? fields.scenarioHandouts : {};
      const selectedScenarios = Array.isArray(fields.passedScenarios) ? fields.passedScenarios : [];
      return selectedScenarios.flatMap(scenario => (Array.isArray(handouts[scenario]) ? handouts[scenario] : []).map(handout => ({ scenario, handout })));
    }

    function scenarioHandoutText(fields, includeSecrets) {
      return scenarioHandoutRecords(fields).map(({ scenario, handout }) => [
        `${scenario} / ${handout.name || "名称未設定"}`,
        scenarioHandoutCharacterName(handout) ? `該当キャラ: ${scenarioHandoutCharacterName(handout)}` : "",
        handout.overview ? `概要: ${handout.overview}` : "",
        includeSecrets && handout.content ? `内容: ${handout.content}` : "",
        includeSecrets && handout.result ? `結果: ${handout.result}` : "",
      ].filter(Boolean).join("\n")).join("\n\n");
    }

    function scenarioHandoutCharacterName(handout, publicView = false) {
      const [type, id] = String(handout.characterRef || "").split(":", 2);
      if (type === "character") return characters.find(item => item.id === id)?.fields?.name || "";
      if (type === "other") {
        const linkedCharacter = otherCharacters.find(item => item.id === id);
        return linkedCharacter && (!publicView || !linkedCharacter.secret) ? linkedCharacter.name : "";
      }
      return "";
    }

    function linkedScenarioHandouts(character) {
      const fields = character.fields || {};
      const passedScenarios = new Set(Array.isArray(fields.passedScenarios) ? fields.passedScenarios : []);
      const refs = Array.isArray(fields.scenarioHandoutRefs) ? new Set(fields.scenarioHandoutRefs) : null;
      return scenarioRecords.flatMap(scenario => {
        if (!passedScenarios.has(scenario.title)) return [];
        const handouts = Array.isArray(scenario.handouts) ? scenario.handouts : [];
        return handouts.flatMap((handout, index) => {
          const key = scenarioHandoutKey(scenario, handout, index);
          return handout.targetId === `character:${character.id}` && (!refs || refs.has(key))
            ? [{ scenario, handout, key }]
            : [];
        });
      });
    }

    function hasVisibleScenarioHandouts(character, publicView) {
      const fields = character.fields || {};
      return scenarioHandoutRecords(fields).some(({ handout }) =>
        handout.name || handout.characterRef || handout.overview || !publicView && (handout.content || handout.result)
      ) || linkedScenarioHandouts(character).some(({ handout }) =>
        handout.title || handout.overview || !publicView && handout.content
      );
    }

    function renderScenarioHandoutViewer(character, publicView) {
      const fields = character.fields || {};
      const passedScenarios = Array.isArray(fields.passedScenarios) ? fields.passedScenarios : [];
      const localHandouts = passedScenarios.flatMap(scenario => {
        const handouts = Array.isArray(fields.scenarioHandouts?.[scenario]) ? fields.scenarioHandouts[scenario] : [];
        const visible = handouts.filter(handout =>
          handout.name || handout.overview || scenarioHandoutCharacterName(handout, publicView) || !publicView && (handout.content || handout.result)
        );
        if (!visible.length) return "";
        return `<section class="viewer-handout-scenario"><h4>${escapeHtml(scenario)}</h4>${visible.map(handout => {
          const characterName = scenarioHandoutCharacterName(handout, publicView);
          return `<article class="viewer-handout"><h5>${escapeHtml(handout.name || "名称未設定")}</h5>${characterName ? `<p><strong>該当キャラ:</strong> ${escapeHtml(characterName)}</p>` : ""}${handout.overview ? `<div><strong>概要</strong><p>${escapeHtml(handout.overview)}</p></div>` : ""}${!publicView && (handout.content || handout.result) ? `<div class="viewer-handout-secret"><strong>秘匿部分</strong>${handout.content ? `<div><b>内容</b><p>${escapeHtml(handout.content)}</p></div>` : ""}${handout.result ? `<div><b>結果</b><p>${escapeHtml(handout.result)}</p></div>` : ""}</div>` : ""}</article>`;
        }).join("")}</section>`;
      });
      const linkedGroups = new Map();
      linkedScenarioHandouts(character).forEach(({ scenario, handout }) => {
        if (!linkedGroups.has(scenario.title)) linkedGroups.set(scenario.title, []);
        linkedGroups.get(scenario.title).push(handout);
      });
      const linkedMarkup = [...linkedGroups].map(([scenario, handouts]) =>
        `<section class="viewer-handout-scenario"><h4>${escapeHtml(scenario)}</h4>${handouts.map(handout => `<article class="viewer-handout"><h5>${escapeHtml(handout.title || "ハンドアウト")}</h5>${handout.overview ? `<div><strong>概要</strong><p>${escapeHtml(handout.overview)}</p></div>` : ""}${!publicView && handout.content ? `<div class="viewer-handout-secret"><strong>秘匿部分</strong><div><b>内容</b><p>${escapeHtml(handout.content)}</p></div></div>` : ""}</article>`).join("")}</section>`
      ).join("");
      return `${localHandouts.join("")}${linkedMarkup}`;
    }

    function renderScenarioHandouts(character) {
      const fields = character.fields || {};
      const selectedScenarios = Array.isArray(fields.passedScenarios) ? fields.passedScenarios : [];
      if (!selectedScenarios.length) return `<small class="field-hint">先に「通過シナリオ」でシナリオを選択してください。</small>`;
      const handoutsByScenario = fields.scenarioHandouts || {};
      return `<div class="scenario-handouts">${selectedScenarios.map(scenario => {
        const handouts = handoutsByScenario[scenario] || [];
        const linkedScenario = scenarioRecords.find(item => item.title === scenario);
        const availableLinkedHandouts = (Array.isArray(linkedScenario?.handouts) ? linkedScenario.handouts : [])
          .map((handout, index) => ({ handout, key: scenarioHandoutKey(linkedScenario, handout, index) }))
          .filter(({ handout }) => handout.targetId === `character:${character.id}`);
        const selectedLinkedRefs = Array.isArray(fields.scenarioHandoutRefs)
          ? new Set(fields.scenarioHandoutRefs)
          : new Set(availableLinkedHandouts.map(item => item.key));
        return `<section class="scenario-handout-group">
          <div class="scenario-handout-heading"><h4>${escapeHtml(scenario)}</h4><button class="button" type="button" data-action="add-scenario-handout" data-scenario="${escapeHtml(scenario)}">＋ ハンドアウトを追加</button></div>
          ${availableLinkedHandouts.length ? `<div class="linked-scenario-handouts"><strong>シナリオ管理のハンドアウト</strong>${availableLinkedHandouts.map(({ handout, key }) => `<label><input type="checkbox" data-scenario-handout-ref="${escapeHtml(key)}" ${selectedLinkedRefs.has(key) ? "checked" : ""}><span>${escapeHtml(handout.title || "ハンドアウト")}${handout.overview ? `<small>${escapeHtml(handout.overview)}</small>` : ""}</span></label>`).join("")}</div>` : ""}
          ${handouts.map((handout, index) => {
            const selectedCharacter = handout.characterRef || "";
            const characterExists = selectedCharacter.startsWith("character:") && characters.some(item => `character:${item.id}` === selectedCharacter);
            const otherCharacterExists = selectedCharacter.startsWith("other:") && otherCharacters.some(item => `other:${item.id}` === selectedCharacter);
            const missingCharacter = selectedCharacter && !characterExists && !otherCharacterExists;
            return `<article class="scenario-handout-card" data-handout-scenario="${escapeHtml(scenario)}" data-handout-id="${escapeHtml(handout.id)}">
              <div class="scenario-handout-card-head"><span>ハンドアウト ${index + 1}</span><button class="button danger" type="button" data-action="remove-scenario-handout" data-scenario="${escapeHtml(scenario)}" data-handout-id="${escapeHtml(handout.id)}">削除</button></div>
              <div class="scenario-handout-fields">
                <div class="scenario-handout-field"><label>名称</label><input type="text" maxlength="120" data-handout-field="name" data-scenario="${escapeHtml(scenario)}" data-handout-id="${escapeHtml(handout.id)}" value="${escapeHtml(handout.name || "")}" placeholder="ハンドアウト名"></div>
                <div class="scenario-handout-field"><label>該当キャラ</label><select data-handout-character data-scenario="${escapeHtml(scenario)}" data-handout-id="${escapeHtml(handout.id)}"><option value="">選択しない</option>${missingCharacter ? `<option value="${escapeHtml(selectedCharacter)}" selected>削除済みのキャラクター</option>` : ""}${characters.length ? `<optgroup label="キャラクター書庫">${characters.map(item => `<option value="character:${escapeHtml(item.id)}"${selectedCharacter === `character:${item.id}` ? " selected" : ""}>${escapeHtml(item.fields?.name || "名前未設定")}</option>`).join("")}</optgroup>` : ""}${otherCharacters.length ? `<optgroup label="他キャラ図書館">${otherCharacters.map(item => `<option value="other:${escapeHtml(item.id)}"${selectedCharacter === `other:${item.id}` ? " selected" : ""}>${escapeHtml(item.name || "名前未設定")}</option>`).join("")}</optgroup>` : ""}</select></div>
                <div class="scenario-handout-field full"><label>概要（公開）</label><textarea rows="3" data-handout-field="overview" data-scenario="${escapeHtml(scenario)}" data-handout-id="${escapeHtml(handout.id)}" placeholder="公開してよい概要">${escapeHtml(handout.overview || "")}</textarea></div>
              </div>
              <div class="scenario-handout-secret"><h5>秘匿部分</h5><div class="scenario-handout-fields">
                <div class="scenario-handout-field full"><label>内容</label><textarea rows="5" data-handout-field="content" data-scenario="${escapeHtml(scenario)}" data-handout-id="${escapeHtml(handout.id)}" placeholder="秘匿内容">${escapeHtml(handout.content || "")}</textarea></div>
                <div class="scenario-handout-field full"><label>結果</label><textarea rows="8" data-handout-field="result" data-scenario="${escapeHtml(scenario)}" data-handout-id="${escapeHtml(handout.id)}" placeholder="シナリオ終了後の結果など（長文可）">${escapeHtml(handout.result || "")}</textarea></div>
              </div></div>
            </article>`;
          }).join("") || `<small class="field-hint">このシナリオのハンドアウトはまだありません。</small>`}
        </section>`;
      }).join("")}</div>`;
    }

    function renderScenarioHandoutPickerField(character) {
      const content = main.querySelector(".scenario-handouts-content");
      if (content) content.innerHTML = renderScenarioHandouts(character);
    }

    function renderScenarioPickerField(character) {
      const field = main.querySelector(".scenario-field-content")?.closest(".field") || main.querySelector('[data-field="passedScenarios"]')?.closest(".field") || main.querySelector('label[for="field-passedScenarios"]')?.closest(".field");
      if (!field) return;
      let container = field.querySelector(".scenario-field-content");
      if (!container) {
        const textarea = field.querySelector('[data-field="passedScenarios"]');
        container = document.createElement("div");
        container.className = "scenario-field-content";
        if (textarea) textarea.closest(".writing-surface")?.replaceWith(container);
        else field.append(container);
      }
      container.innerHTML = renderScenarioPicker(character, character.fields || {});
    }

    async function persistCurrent() {
      clearTimeout(saveTimer);
      saveTimer = null;
      const character = activeCharacter();
      if (!character) return;
      character.updatedAt = Date.now();
      saveState.textContent = "保存中...";
      try {
        await writeCharacter(character);
        if (Array.isArray(character.fields.passedScenarios)) {
          try { localStorage.setItem(scenarioSyncSignalKey, String(Date.now())); } catch {}
        }
        saveState.textContent = "保存しました";
        renderLibrary();
      } catch (error) {
        saveState.textContent = "保存に失敗しました";
        showToast(`保存できませんでした: ${error.message}`);
      }
    }

    function scheduleSave() {
      saveState.textContent = "未保存の変更があります";
      clearTimeout(saveTimer);
      saveTimer = setTimeout(persistCurrent, 350);
    }

    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.hidden = false;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { toast.hidden = true; }, 2600);
    }

    function downloadCharacter(character) {
      const blob = new Blob([JSON.stringify({ app: "TRPG Character Library", version: 1, character }, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const anchor = document.createElement("a");
      const safeName = (character.fields.name || "character").replace(/[\\/:*?"<>|]/g, "_");
      anchor.href = url;
      anchor.download = `${safeName}.json`;
      anchor.click();
      URL.revokeObjectURL(url);
      showToast("キャラクターをJSONファイルに書き出しました");
    }

    document.getElementById("newButton").addEventListener("click", async () => {
      await persistCurrent();
      const character = newCharacter();
      characters.unshift(character);
      currentId = character.id;
      screenMode = "edit";
      await writeCharacter(character);
      renderEditor();
      main.querySelector("input[data-field='name']")?.focus();
    });

    document.getElementById("viewModeButton").addEventListener("click", async () => {
      if (screenMode === "view") return;
      await persistCurrent();
      screenMode = "view";
      addingProfession = false;
      renderEditor();
    });
    window.addEventListener("audience-mode-change", () => {
      const character = activeCharacter();
      if (character && screenMode === "view") renderViewer(character);
    });

    document.getElementById("editModeButton").addEventListener("click", async () => {
      if (screenMode === "edit") return;
      screenMode = "edit";
      renderEditor();
    });

    document.getElementById("searchName").addEventListener("input", renderLibrary);
    document.getElementById("searchProfession").addEventListener("change", renderLibrary);
    window.addEventListener("storage", async event => {
      if (event.key === scenarioRecordsStorageKey || event.key === scenarioStorageKey) {
        scenarioRecords = readScenarioRecords();
        try {
          npcCharacters = await readNpcCharacters();
          if (event.key === scenarioStorageKey) {
            const stored = JSON.parse(event.newValue || "[]");
            scenarioOptions = [...new Set([...(Array.isArray(stored) ? stored : []), ...npcCharacters.map(npc => npc.fields?.scenario)].filter(value => typeof value === "string" && value.trim()))];
          } else {
            scenarioOptions = [...new Set([...scenarioOptions, ...npcCharacters.map(npc => npc.fields?.scenario)].filter(value => typeof value === "string" && value.trim()))];
          }
        } catch (error) {
          showToast(`シナリオ・NPC情報を更新できませんでした: ${error.message}`);
          return;
        }
        const character = activeCharacter();
        if (character) {
          if (screenMode === "edit") {
            if (event.key === scenarioRecordsStorageKey) renderScenarioHandoutPickerField(character);
            renderScenarioPickerField(character);
            refreshRelationshipNpcOptions();
          } else renderViewer(character);
        }
        return;
      }
      if (event.key === otherCharacterStorageKey) {
        otherCharacters = readOtherCharacters();
        const character = activeCharacter();
        if (character) renderEditor();
        return;
      }
    });
    main.addEventListener("toggle", event => {
      if (!event.target.matches(".field-visibility")) return;
      openVisibilityGroup = event.target.open ? Number(event.target.dataset.visibilityGroup) : null;
    }, true);
    main.addEventListener("change", async event => {
      const fieldKey = event.target.dataset.visibilityField;
      const character = activeCharacter();
      if (!character) return;
      if (fieldKey) {
        character.fieldVisibility ||= {};
        character.fieldVisibility[fieldKey] = event.target.checked;
        openVisibilityGroup = Number(event.target.dataset.group);
        scheduleSave();
        renderEditor();
      } else if (event.target.dataset.personCharacter !== undefined) {
        const person = character.relationships[Number(event.target.dataset.personCharacter)];
        if (!person) return;
        const previousCharacterId = person.characterId || person.reciprocalCharacterId || "";
        const [linkedType, linkedId] = event.target.value.split(":", 2);
        person.characterId = linkedType === "character" ? linkedId : "";
        person.npcId = linkedType === "npc" ? linkedId : "";
        person.otherCharacterId = linkedType === "other" ? linkedId : "";
        const linkedOtherCharacter = otherCharacters.find(item => item.id === person.otherCharacterId);
        if (linkedOtherCharacter) {
          person.name = linkedOtherCharacter.name;
          const nameInput = main.querySelector(`[data-person="${Number(event.target.dataset.personCharacter)}"][data-person-field="name"]`);
          if (nameInput) nameInput.value = linkedOtherCharacter.name;
          main.querySelectorAll(`[data-memory-person="${CSS.escape(person.id)}"]`).forEach(input => {
            input.parentElement.lastChild.textContent = linkedOtherCharacter.name || "名前未設定";
          });
        }
        if (!person.characterId) delete person.characterId;
        if (!person.npcId) delete person.npcId;
        if (!person.otherCharacterId) delete person.otherCharacterId;
        await syncReciprocalRelationship(character, person, previousCharacterId);
        updateRelationshipPortrait(event.target.closest(".relation"), person);
        const relatedMemories = (character.fields.memories || []).filter(memory => (memory.relatedPeople || []).includes(person.id));
        relatedMemories.forEach(memory => {
          memory.sharedWithCharacterIds ||= previousCharacterId ? [previousCharacterId] : [];
          if (previousCharacterId) memory.sharedWithCharacterIds = memory.sharedWithCharacterIds.filter(id => id !== previousCharacterId);
          if (person.characterId && !memory.sharedWithCharacterIds.includes(person.characterId)) memory.sharedWithCharacterIds.push(person.characterId);
          syncSharedMemory(character, memory).catch(error => showToast(`思い出を共有できませんでした: ${error.message}`));
        });
        scheduleSave();
      } else if (event.target.dataset.memorySecret !== undefined) {
        const memory = character.fields.memories?.[Number(event.target.dataset.memorySecret)];
        if (!memory) return;
        memory.secret = event.target.checked;
        updateSharedMemory(character, memory, { secret: memory.secret }).catch(error => showToast(`思い出を同期できませんでした: ${error.message}`));
        scheduleSave();
      } else if (event.target.dataset.personSecret !== undefined) {
        const person = character.relationships.find(item => item.id === event.target.dataset.personSecret);
        if (!person) return;
        person.secret = event.target.checked;
        scheduleSave();
      } else if (event.target.matches('[data-field="profession"]')) {
        pruneProfessionOptions();
        renderLibrary();
      } else if (event.target.dataset.memoryPerson !== undefined) {
        const memory = character.fields.memories?.[Number(event.target.dataset.memoryIndex)];
        if (!memory) return;
        const picker = event.target.closest(".memory-people-picker");
        const selectedCount = picker?.querySelectorAll('input[data-memory-person]:checked').length || 0;
        const summary = picker?.querySelector("summary");
        if (summary) summary.textContent = `関係する人を選ぶ (${selectedCount})`;
        await updateSharedMemoryPerson(character, memory, event.target.dataset.memoryPerson, event.target.checked).catch(error => showToast(`思い出を共有できませんでした: ${error.message}`));
        scheduleSave();
      } else if (event.target.dataset.passedScenario !== undefined) {
        character.fields.passedScenarios = Array.isArray(character.fields.passedScenarios) ? character.fields.passedScenarios : [];
        const scenario = event.target.dataset.passedScenario;
        if (event.target.checked && !character.fields.passedScenarios.includes(scenario)) character.fields.passedScenarios.push(scenario);
        else if (!event.target.checked) character.fields.passedScenarios = character.fields.passedScenarios.filter(value => value !== scenario);
        const summary = event.target.closest(".scenario-picker")?.querySelector("summary");
        if (summary) summary.textContent = `シナリオを選ぶ (${character.fields.passedScenarios.length})`;
        renderScenarioPickerField(character);
        renderScenarioHandoutPickerField(character);
        scheduleSave();
      } else if (event.target.dataset.scenarioHandoutRef !== undefined) {
        if (!Array.isArray(character.fields.scenarioHandoutRefs)) {
          character.fields.scenarioHandoutRefs = linkedScenarioHandouts(character).map(item => item.key);
        }
        const ref = event.target.dataset.scenarioHandoutRef;
        if (event.target.checked && !character.fields.scenarioHandoutRefs.includes(ref)) character.fields.scenarioHandoutRefs.push(ref);
        else if (!event.target.checked) character.fields.scenarioHandoutRefs = character.fields.scenarioHandoutRefs.filter(item => item !== ref);
        renderScenarioHandoutPickerField(character);
        scheduleSave();
      } else if (event.target.dataset.handoutCharacter !== undefined) {
        const handout = character.fields.scenarioHandouts?.[event.target.dataset.scenario]?.find(item => item.id === event.target.dataset.handoutId);
        if (!handout) return;
        handout.characterRef = event.target.value;
        scheduleSave();
      }
    });
    library.addEventListener("click", async event => {
      const button = event.target.closest("[data-id]");
      if (!button) return;
      await persistCurrent();
      currentId = button.dataset.id;
      renderEditor();
    });

    main.addEventListener("input", event => {
      const character = activeCharacter();
      if (!character) return;
      if (event.target.dataset.memoryNote !== undefined) {
        const memory = character.fields.memories?.[Number(event.target.dataset.memoryNote)];
        if (memory) {
          memory.note = event.target.value;
          updateSharedMemory(character, memory, { note: memory.note }).catch(error => showToast(`思い出を同期できませんでした: ${error.message}`));
        }
      }
      if (event.target.dataset.field) {
        character.fields[event.target.dataset.field] = event.target.value;
        if (event.target.dataset.field === "name") updateReciprocalNames(character).catch(error => showToast(`相手側の関係を更新できませんでした: ${error.message}`));
        if (event.target.dataset.field === "themeColor" && /^#[0-9a-fA-F]{6}$/.test(event.target.value)) {
          main.querySelector('[data-color-picker="themeColor"]').value = event.target.value;
          main.style.setProperty("--character-color", event.target.value);
          main.querySelector(".editor").style.setProperty("--character-color", event.target.value);
          profileRail.style.setProperty("--character-color", event.target.value);
          renderLibrary();
        }
        if (["name", "profession", "class", "age", "origin"].includes(event.target.dataset.field)) renderProfile(character);
      }
      if (event.target.dataset.colorPicker) {
        character.fields[event.target.dataset.colorPicker] = event.target.value;
        main.querySelector(`#field-${event.target.dataset.colorPicker}`).value = event.target.value.toUpperCase();
        main.style.setProperty("--character-color", event.target.value);
        main.querySelector(".editor").style.setProperty("--character-color", event.target.value);
        profileRail.style.setProperty("--character-color", event.target.value);
        renderLibrary();
      }
      if (event.target.dataset.personField) {
        const person = character.relationships[Number(event.target.dataset.person)];
        person[event.target.dataset.personField] = event.target.value;
        if (event.target.dataset.personField === "name") {
          const memoryPersonLabels = main.querySelectorAll(`[data-memory-person="${CSS.escape(person.id)}"]`);
          memoryPersonLabels.forEach(input => { input.parentElement.lastChild.textContent = event.target.value || "名前未設定"; });
        }
      }
      if (event.target.dataset.handoutField) {
        const handout = character.fields.scenarioHandouts?.[event.target.dataset.scenario]?.find(item => item.id === event.target.dataset.handoutId);
        if (handout) handout[event.target.dataset.handoutField] = event.target.value;
      }
      scheduleSave();
    });

    main.addEventListener("change", async event => {
      if (event.target.dataset.memoryImage === undefined) return;
      const file = event.target.files?.[0];
      event.target.value = "";
      if (!file) return;
      if (!file.type.startsWith("image/") || file.size > 20 * 1024 * 1024) {
        showToast("20MB以下の画像ファイルを選択してください");
        return;
      }
      const character = activeCharacter();
      const memory = character?.fields.memories?.[Number(event.target.dataset.memoryImage)];
      if (!memory) return;
      try {
        memory.image = await imageToDataUrl(file);
        await updateSharedMemory(character, memory, { image: memory.image });
        await persistCurrent();
        renderEditor();
        showToast("思い出の画像を保存しました");
      } catch (error) {
        showToast(`画像を読み込めませんでした: ${error.message}`);
      }
    });

    profileRail.addEventListener("click", event => {
      const action = event.target.closest("[data-profile-action]")?.dataset.profileAction;
      if (action === "upload") profileRail.querySelector("#portraitFile").click();
      if (action === "upload-background") profileRail.querySelector("#customBackgroundFile").click();
      if (action === "remove-background") {
        const character = activeCharacter();
        if (!character) return;
        const portraitIndex = Math.min(Math.max(Number(character.fields.activePortraitIndex) || 0, 0), getPortraits(character.fields).length - 1);
        getPortraitBackgroundSettings(character, portraitIndex).customBackground = "";
        renderProfile(character);
        scheduleSave();
      }
      if (action === "remove") {
        const character = activeCharacter();
        if (!character) return;
        const portraits = getPortraits(character.fields);
        const activeIndex = Math.min(Math.max(Number(character.fields.activePortraitIndex) || 0, 0), portraits.length - 1);
        portraits.splice(activeIndex, 1);
        if (Array.isArray(character.fields.portraitBackgrounds)) character.fields.portraitBackgrounds.splice(activeIndex, 1);
        character.fields.portraits = portraits;
        character.fields.activePortraitIndex = Math.max(0, Math.min(activeIndex, portraits.length - 1));
        delete character.fields.portraitData;
        renderProfile(character);
        scheduleSave();
      }
      const portraitIndex = event.target.closest("[data-portrait-index]")?.dataset.portraitIndex;
      if (portraitIndex !== undefined) {
        const character = activeCharacter();
        if (!character) return;
        character.fields.activePortraitIndex = Number(portraitIndex);
        renderProfile(character);
        scheduleSave();
      }
    });

    profileRail.addEventListener("change", async event => {
      const character = activeCharacter();
      if (!character) return;
      const portraitIndex = Math.min(Math.max(Number(character.fields.activePortraitIndex) || 0, 0), getPortraits(character.fields).length - 1);
      const backgroundSettings = getPortraitBackgroundSettings(character, portraitIndex);
      if (event.target.id === "customBackgroundFit") {
        backgroundSettings.fit = event.target.value;
        renderProfile(character);
        scheduleSave();
        return;
      }
      if (["portraitBackground", "portraitPatternColor"].includes(event.target.id)) {
        if (event.target.id === "portraitBackground") backgroundSettings.pattern = event.target.value;
        else backgroundSettings.patternColor = event.target.value;
        renderProfile(character);
        scheduleSave();
        return;
      }
      if (event.target.id === "customBackgroundFile") {
        const file = event.target.files?.[0];
        event.target.value = "";
        if (!file) return;
        if (!file.type.startsWith("image/") || file.size > 20 * 1024 * 1024) {
          showToast("20MB以下の画像ファイルを選択してください");
          return;
        }
        try {
          backgroundSettings.customBackground = await imageToDataUrl(file);
          await persistCurrent();
          renderProfile(character);
          showToast("背景画像を保存しました");
        } catch (error) {
          showToast(`背景画像を読み込めませんでした: ${error.message}`);
        }
        return;
      }
      if (event.target.id !== "portraitFile") return;
      const files = Array.from(event.target.files || []);
      event.target.value = "";
      if (!files.length) return;
      try {
        const portraits = getPortraits(character.fields);
        const remaining = Math.max(0, 12 - portraits.length);
        const validFiles = files.filter(file => file.type.startsWith("image/") && file.size <= 20 * 1024 * 1024).slice(0, remaining);
        if (validFiles.length < files.length) showToast(remaining === 0 ? "立ち絵は最大12枚まで登録できます" : "画像ファイルかつ20MB以下の画像を追加しました（最大12枚）");
        if (!validFiles.length) return;
        const addedPortraits = await Promise.all(validFiles.map(imageToDataUrl));
        character.fields.portraits = [...portraits, ...addedPortraits];
        if (!Array.isArray(character.fields.portraitBackgrounds)) getPortraitBackgroundSettings(character, Math.min(Math.max(Number(character.fields.activePortraitIndex) || 0, 0), portraits.length - 1));
        for (let index = 0; index < addedPortraits.length; index += 1) {
          character.fields.portraitBackgrounds.push({ pattern: "solid", patternColor: "white", customBackground: "", fit: "cover" });
        }
        character.fields.activePortraitIndex = character.fields.portraits.length - 1;
        delete character.fields.portraitData;
        await persistCurrent();
        renderProfile(character);
        showToast(`${addedPortraits.length}枚の立ち絵を追加しました`);
      } catch (error) {
        showToast(`立ち絵を読み込めませんでした: ${error.message}`);
      }
    });

    main.addEventListener("click", async event => {
      const action = event.target.closest("[data-action]")?.dataset.action;
      if (!action) return;
      const character = activeCharacter();
      if (action === "copy-profile" && character) {
        await copyProfile(character, event.target.closest("[data-include-secrets]").dataset.includeSecrets === "true");
        return;
      }
      if (action === "add-profession" && character) {
        addingProfession = true;
        renderEditor();
        main.querySelector("#newProfession")?.focus();
        return;
      }
      if (action === "cancel-profession") {
        addingProfession = false;
        renderEditor();
        return;
      }
      if (action === "add-scenario" && character) {
        addingScenario = true;
        renderScenarioPickerField(character);
        main.querySelector("#newScenarioOption")?.focus();
        return;
      }
      if (action === "cancel-scenario" && character) {
        addingScenario = false;
        renderScenarioPickerField(character);
        return;
      }
      if (action === "save-scenario" && character) {
        const input = main.querySelector("#newScenarioOption");
        const scenario = input?.value.trim();
        if (!scenario) { input?.focus(); return; }
        scenarioOptions = [...new Set([...scenarioOptions, scenario])].sort((left, right) => left.localeCompare(right, "ja"));
        try {
          localStorage.setItem(scenarioStorageKey, JSON.stringify(scenarioOptions));
        } catch {
          showToast("シナリオ候補をこのブラウザーに保存できませんでした");
          return;
        }
        character.fields.passedScenarios = [...new Set([...(Array.isArray(character.fields.passedScenarios) ? character.fields.passedScenarios : []), scenario])];
        addingScenario = false;
        scheduleSave();
        renderScenarioPickerField(character);
        renderScenarioHandoutPickerField(character);
        return;
      }
      if (action === "add-scenario-handout" && character) {
        const scenario = event.target.closest("[data-scenario]")?.dataset.scenario;
        if (!scenario) return;
        character.fields.scenarioHandouts ||= {};
        character.fields.scenarioHandouts[scenario] ||= [];
        const handout = { id: crypto.randomUUID(), name: "", characterRef: "", overview: "", content: "", result: "" };
        character.fields.scenarioHandouts[scenario].push(handout);
        renderScenarioHandoutPickerField(character);
        scheduleSave();
        main.querySelector(`[data-handout-field="name"][data-handout-id="${CSS.escape(handout.id)}"]`)?.focus();
        return;
      }
      if (action === "remove-scenario-handout" && character) {
        const button = event.target.closest("[data-scenario][data-handout-id]");
        const scenario = button?.dataset.scenario;
        const handoutId = button?.dataset.handoutId;
        if (!scenario || !handoutId || !character.fields.scenarioHandouts?.[scenario]) return;
        character.fields.scenarioHandouts[scenario] = character.fields.scenarioHandouts[scenario].filter(item => item.id !== handoutId);
        renderScenarioHandoutPickerField(character);
        scheduleSave();
        return;
      }
      if (action === "add-memory" && character) {
        character.fields.memories ||= [];
        character.fields.memories.push({ id: crypto.randomUUID(), image: "", note: "", relatedPeople: [] });
        scheduleSave();
        renderEditor();
        return;
      }
      if (action === "remove-memory" && character) {
        const memory = character.fields.memories?.[Number(event.target.closest("[data-index]").dataset.index)];
        if (!memory) return;
        const sourceId = memory.sharedSourceCharacterId || character.id;
        const sharedId = memory.sharedMemoryId || memory.id;
        const sharedCount = characters.filter(item => item.id !== character.id && item.fields.memories?.some(entry => item.id === sourceId ? entry.id === sharedId : entry.sharedMemoryId === sharedId && entry.sharedSourceCharacterId === sourceId)).length;
        const warning = sharedCount ? `この思い出は他のキャラクターにも共有されています（共有先 ${sharedCount} 人）。\nすべての共有コピーを削除しますか？` : "この思い出を削除しますか？\nこの操作は取り消せません。";
        if (!confirm(warning)) return;
        await removeSharedMemory(character, memory);
        scheduleSave();
        renderEditor();
        return;
      }
      if (action === "save-profession" && character) {
        const profession = main.querySelector("#newProfession")?.value.trim();
        if (!profession) {
          main.querySelector("#newProfession")?.focus();
          return;
        }
        professionOptions = [...new Set([...professionOptions, profession])];
        try {
          localStorage.setItem("trpg-profession-options", JSON.stringify(professionOptions));
        } catch {
          showToast("職業候補をこのブラウザーに保存できませんでした");
        }
        character.fields.profession = profession;
        pruneProfessionOptions();
        addingProfession = false;
        scheduleSave();
        renderEditor();
        return;
      }
      if (action === "create") document.getElementById("newButton").click();
      if (action === "add-person" && character) {
        character.relationships.push({ id: crypto.randomUUID(), name: "", relationship: "", meeting: "", impression: "", feelings: "", memo: "" });
        renderRelationships(character);
        renderRelationshipSecretControls(character);
        scheduleSave();
      }
      if (action === "remove-person" && character) {
        const [removedPerson] = character.relationships.splice(Number(event.target.closest("[data-index]").dataset.index), 1);
        if (removedPerson.reciprocalCharacterId) {
          const target = characters.find(item => item.id === removedPerson.reciprocalCharacterId);
          if (target) {
            target.relationships = target.relationships.filter(person => person.id !== removedPerson.reciprocalRelationshipId);
            await writeCharacter(target);
          }
        }
        character.fields.memories?.forEach(memory => {
          memory.relatedPeople = (memory.relatedPeople || []).filter(id => id !== removedPerson.id);
        });
        renderRelationships(character);
        renderRelationshipSecretControls(character);
        scheduleSave();
      }
      if (action === "duplicate" && character) {
        await persistCurrent();
        const duplicate = structuredClone(character);
        duplicate.id = crypto.randomUUID();
        duplicate.fields.name = `${duplicate.fields.name || "名前未設定"}（複製）`;
        duplicate.createdAt = Date.now();
        duplicate.updatedAt = Date.now();
        characters.unshift(duplicate);
        currentId = duplicate.id;
        await writeCharacter(duplicate);
        renderEditor();
      }
      if (action === "delete" && character && confirm(`「${character.fields.name || "名前未設定"}」を削除しますか？\nこの操作は取り消せません。`)) {
        await removeReciprocalRelationships(character);
        await removeCharacter(character.id);
        characters = characters.filter(item => item.id !== character.id);
        pruneProfessionOptions();
        currentId = characters[0]?.id || null;
        renderEditor();
        showToast("キャラクターを削除しました");
      }
    });

    document.getElementById("exportButton").addEventListener("click", async () => {
      await persistCurrent();
      const character = activeCharacter();
      if (character) downloadCharacter(character);
    });

    document.getElementById("importButton").addEventListener("click", () => document.getElementById("importFile").click());
    document.getElementById("importFile").addEventListener("change", async event => {
      const file = event.target.files[0];
      if (!file) return;
      try {
        const data = JSON.parse(await file.text());
        const imported = data.character || data;
        if (!imported.fields || typeof imported.fields !== "object") throw new Error("キャラクター形式のJSONではありません");
        await persistCurrent();
        const character = newCharacter();
        character.fields = { ...character.fields, ...imported.fields };
        character.relationships = Array.isArray(imported.relationships) ? imported.relationships : [];
        characters.unshift(character);
        pruneProfessionOptions();
        currentId = character.id;
        await writeCharacter(character);
        renderEditor();
        showToast("キャラクターを読み込みました");
      } catch (error) {
        showToast(`読み込めませんでした: ${error.message}`);
      } finally {
        event.target.value = "";
      }
    });

    window.addEventListener("beforeunload", event => {
      if (saveTimer) {
        event.preventDefault();
        event.returnValue = "";
      }
    });

    (async function start() {
      try {
        database = await openDatabase();
        characters = await readAll();
        scenarioRecords = readScenarioRecords();
        npcCharacters = await readNpcCharacters();
        otherCharacters = readOtherCharacters();
        const mergedScenarios = [...new Set([...scenarioOptions, ...npcCharacters.map(npc => npc.fields?.scenario)].filter(value => typeof value === "string" && value.trim()))];
        if (mergedScenarios.length !== scenarioOptions.length) {
          scenarioOptions = mergedScenarios;
          try { localStorage.setItem(scenarioStorageKey, JSON.stringify(scenarioOptions)); } catch {}
        }
        pruneProfessionOptions();
        currentId = characters[0]?.id || null;
        renderEditor();
      } catch (error) {
        main.innerHTML = `<section class="welcome"><h2>ローカル保存を開始できません</h2><p>このブラウザーではローカルデータベースを利用できません。最新版のChromeまたはEdgeで開き直してください。<br>${escapeHtml(error.message)}</p></section>`;
        saveState.textContent = "保存機能を利用できません";
      }
    })();
  </script>
  <script src="view-mode.js"></script>
</body>
</html>
