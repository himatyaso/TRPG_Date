<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f2efe7">
  <title>マイプロフィール | TRPG</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f2efe7;
      --surface: #fffefa;
      --ink: #242a26;
      --muted: #72796f;
      --line: #deded3;
      --green: #28634e;
      --green-dark: #1c493a;
      --coral: #c15d46;
      --serif: "Yu Mincho", "Hiragino Mincho ProN", "Noto Serif JP", Georgia, serif;
      --sans: "Yu Gothic UI", "Meiryo", sans-serif;
    }
    * { box-sizing: border-box; }
    body { min-width: 320px; min-height: 100vh; margin: 0; color: var(--ink); background: var(--paper); font-family: var(--sans); }
    button, input, textarea { font: inherit; }
    button, a { cursor: pointer; }
    .topbar { position: sticky; top: 0; z-index: 30; min-height: 72px; display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 0 max(24px, calc((100vw - 1000px) / 2)); border-bottom: 1px solid #d9d8ce; background: rgba(255,254,250,.96); }
    .brand { display: inline-flex; align-items: center; gap: 11px; color: inherit; font: 18px var(--serif); text-decoration: none; }
    .brand-mark { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; color: white; background: var(--green); font: 17px Georgia, serif; }
    .home-link { color: var(--green-dark); font-size: 12px; text-decoration: none; }
    .home-link:hover { text-decoration: underline; }
    main { width: min(100% - 40px, 920px); margin: 48px auto 72px; }
    .intro { padding-bottom: 24px; border-bottom: 1px solid #d6d7cc; }
    .eyebrow { margin: 0 0 9px; color: var(--coral); font-size: 10px; font-weight: 700; letter-spacing: 1px; }
    h1 { margin: 0; font: 34px/1.35 var(--serif); }
    .intro-copy { margin: 8px 0 0; color: var(--muted); font-size: 12px; line-height: 1.8; }
    .profile-card { display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: 28px; margin-top: 28px; padding: 26px; border: 1px solid var(--line); border-top: 3px solid var(--green); border-radius: 3px; background: var(--surface); box-shadow: 0 6px 18px rgba(30,35,31,.06); }
    .profile-image { display: grid; width: 100%; aspect-ratio: 1; place-items: center; overflow: hidden; border: 1px solid var(--line); border-radius: 3px; background: #f6f5ef; color: var(--muted); font: 34px var(--serif); }
    .profile-image img { width: 100%; height: 100%; object-fit: cover; }
    .profile-content { min-width: 0; }
    .profile-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
    .profile-name { margin: 0; overflow-wrap: anywhere; font: 28px/1.4 var(--serif); }
    .profile-handle { margin: 3px 0 0; color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
    .profile-intro { margin: 20px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14px; line-height: 1.9; }
    .profile-facts { display: grid; gap: 13px; margin: 20px 0 0; padding-top: 17px; border-top: 1px solid var(--line); }
    .profile-fact { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 10px; font-size: 12px; line-height: 1.7; }
    .profile-fact dt { color: var(--muted); }
    .profile-fact dd { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
    .profile-link { display: inline-block; margin-top: 18px; color: var(--green-dark); font-size: 12px; text-underline-offset: 3px; }
    .empty-profile { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.8; }
    .editor { margin-top: 24px; padding: 22px; border: 1px solid var(--line); border-radius: 3px; background: var(--surface); }
    .editor[hidden] { display: none; }
    .editor-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
    h2 { margin: 0; font: 20px var(--serif); }
    .fields { display: grid; gap: 14px; }
    .field { display: grid; gap: 6px; }
    .field label { color: #555e56; font-size: 11px; font-weight: 600; }
    .field input, .field textarea { width: 100%; min-width: 0; border: 1px solid #d8d9cf; border-radius: 3px; outline: none; background: var(--surface); color: var(--ink); font-size: 13px; }
    .field input { height: 39px; padding: 0 10px; }
    .field textarea { min-height: 120px; padding: 9px 10px; line-height: 1.7; resize: vertical; }
    .field input:focus, .field textarea:focus { border-color: #70917d; box-shadow: 0 0 0 3px rgba(40,99,78,.1); }
    .image-actions { display: flex; flex-wrap: wrap; gap: 7px; }
    .image-actions input { width: auto; max-width: 100%; height: auto; padding: 6px; font-size: 11px; }
    .image-note, .storage-note { margin: 0; color: var(--muted); font-size: 10px; line-height: 1.7; }
    .form-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
    .button { display: inline-flex; min-height: 38px; align-items: center; justify-content: center; padding: 0 13px; border: 1px solid var(--line); border-radius: 3px; color: var(--ink); background: var(--surface); font-size: 12px; text-decoration: none; }
    .button:hover { border-color: #9eaa9e; background: #f8f8f1; }
    .button.primary { border-color: var(--green); color: white; background: var(--green); }
    .button.primary:hover { background: var(--green-dark); }
    .save-state { min-height: 18px; margin: 11px 0 0; color: var(--muted); font-size: 11px; }
    .save-state[data-error="true"] { color: #a54234; }
    [hidden] { display: none !important; }
    a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid #d6aa57; outline-offset: 2px; }
    @media (max-width: 640px) {
      .topbar { min-height: 64px; padding: 0 18px; }
      .brand { font-size: 15px; }
      main { width: min(100% - 32px, 600px); margin-top: 32px; }
      h1 { font-size: 29px; }
      .profile-card { grid-template-columns: 1fr; gap: 18px; padding: 18px; }
      .profile-image { width: min(100%, 180px); }
      .profile-heading { flex-direction: column; }
      .profile-name { font-size: 24px; }
      .profile-fact { grid-template-columns: 1fr; gap: 2px; }
      .editor { padding: 17px; }
    }
  </style>
</head>
<body>
  <script src="data-file-storage.js"></script>
  <header class="topbar">
    <a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true">✦</span><span>TRPG マイプロフィール</span></a>
    <a class="home-link" href="index.html">← 管理室へ戻る</a>
  </header>
  <main>
    <section class="intro" aria-labelledby="pageTitle">
      <p class="eyebrow">MY PROFILE</p>
      <h1 id="pageTitle">自己紹介</h1>
      <p class="intro-copy">TRPGの遊び方や好きなものをまとめたプロフィールです。</p>
    </section>
    <article class="profile-card" aria-labelledby="profileName">
      <div class="profile-image" id="profileImage" aria-label="プロフィール画像">✦</div>
      <div class="profile-content">
        <div class="profile-heading">
          <div>
            <h2 class="profile-name" id="profileName">プロフィール未設定</h2>
            <p class="profile-handle" id="profileHandle" hidden></p>
          </div>
          <button class="button" id="editButton" type="button">プロフィールを編集</button>
        </div>
        <p class="profile-intro" id="profileIntro"></p>
        <dl class="profile-facts" id="profileFacts"></dl>
        <a class="profile-link" id="profileLink" target="_blank" rel="noopener noreferrer" hidden></a>
        <p class="empty-profile" id="emptyProfile">編集ボタンから名前や自己紹介を登録してください。</p>
      </div>
    </article>
    <form class="editor" id="profileForm" hidden>
      <div class="editor-heading">
        <h2>プロフィールを編集</h2>
        <span class="image-note">名前は必須</span>
      </div>
      <div class="fields">
        <div class="field">
          <label for="displayName">表示名 *</label>
          <input id="displayName" maxlength="80" required placeholder="名前・ハンドルネーム">
        </div>
        <div class="field">
          <label for="handle">読み方・呼ばれ方（任意）</label>
          <input id="handle" maxlength="100" placeholder="例：〇〇と呼んでください">
        </div>
        <div class="field">
          <label for="introduction">自己紹介</label>
          <textarea id="introduction" maxlength="5000" placeholder="TRPGを始めたきっかけや、普段の遊び方など"></textarea>
        </div>
        <div class="field">
          <label for="favorites">好きなシステム・ジャンル</label>
          <textarea id="favorites" maxlength="2000" placeholder="好きなTRPGシステムやシナリオの傾向"></textarea>
        </div>
        <div class="field">
          <label for="playStyle">遊び方・プレイスタイル</label>
          <textarea id="playStyle" maxlength="2000" placeholder="PL・GMの経験、遊びたい雰囲気など"></textarea>
        </div>
        <div class="field">
          <label for="profileUrl">紹介したいリンク（任意）</label>
          <input id="profileUrl" type="url" maxlength="2048" placeholder="https://">
        </div>
        <div class="field">
          <label for="profileUrlLabel">リンクの表示名</label>
          <input id="profileUrlLabel" maxlength="80" placeholder="SNS・作品一覧など">
        </div>
        <div class="field">
          <label for="profileImageInput">プロフィール画像（任意）</label>
          <div class="image-actions">
            <input id="profileImageInput" type="file" accept="image/*" aria-label="プロフィール画像を選択">
            <button class="button" id="removeImageButton" type="button">画像を外す</button>
          </div>
          <p class="image-note">画像は縮小してこのブラウザーに保存します。元画像は20MB以下にしてください。</p>
        </div>
      </div>
      <div class="form-actions">
        <button class="button primary" type="submit">保存</button>
        <button class="button" id="cancelButton" type="button">キャンセル</button>
      </div>
      <p class="storage-note">プロフィールはこのブラウザーに保存されます。他の端末や人と共有する場合は、別途公開できる場所にページを配置してください。</p>
      <p class="save-state" id="saveState" role="status" aria-live="polite"></p>
    </form>
  </main>
  <script>
    "use strict";
    const STORAGE_KEY = "trpg-my-profile";
    const form = document.getElementById("profileForm");
    const imageInput = document.getElementById("profileImageInput");
    let profileImage = "";
    let profile = loadProfile();

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, character => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" })[character]);
    }

    function loadProfile() {
      try {
        const stored = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
        return stored && typeof stored === "object" ? stored : null;
      } catch (error) {
        showStatus(`プロフィールを読み込めませんでした: ${error.message}`, true);
        return null;
      }
    }

    function showStatus(message, error = false) {
      const status = document.getElementById("saveState");
      status.textContent = message;
      status.dataset.error = String(error);
    }

    function renderProfile() {
      const hasProfile = Boolean(profile?.name);
      document.getElementById("profileName").textContent = hasProfile ? profile.name : "プロフィール未設定";
      const handle = document.getElementById("profileHandle");
      handle.textContent = profile?.handle || "";
      handle.hidden = !profile?.handle;
      const image = document.getElementById("profileImage");
      image.innerHTML = profile?.image ? `<img src="${escapeHtml(profile.image)}" alt="${escapeHtml(profile.name || "プロフィール")}の画像">` : "✦";
      document.getElementById("profileIntro").textContent = profile?.introduction || "";
      const facts = [
        ["好きなシステム・ジャンル", profile?.favorites],
        ["遊び方・プレイスタイル", profile?.playStyle],
      ].filter(([, value]) => value);
      document.getElementById("profileFacts").innerHTML = facts.map(([label, value]) => `<div class="profile-fact"><dt>${escapeHtml(label)}</dt><dd>${escapeHtml(value)}</dd></div>`).join("");
      const link = document.getElementById("profileLink");
      link.hidden = true;
      link.removeAttribute("href");
      if (profile?.url) {
        try {
          const url = new URL(profile.url);
          if (url.protocol === "https:" || url.protocol === "http:") {
            link.href = url.href;
            link.textContent = profile.urlLabel || "リンクを開く";
            link.hidden = false;
          }
        } catch (error) {
          showStatus(`保存されたリンクを表示できません: ${error.message}`, true);
        }
      }
      document.getElementById("emptyProfile").hidden = hasProfile;
      document.getElementById("editButton").textContent = hasProfile ? "プロフィールを編集" : "プロフィールを作成";
    }

    function fillForm() {
      document.getElementById("displayName").value = profile?.name || "";
      document.getElementById("handle").value = profile?.handle || "";
      document.getElementById("introduction").value = profile?.introduction || "";
      document.getElementById("favorites").value = profile?.favorites || "";
      document.getElementById("playStyle").value = profile?.playStyle || "";
      document.getElementById("profileUrl").value = profile?.url || "";
      document.getElementById("profileUrlLabel").value = profile?.urlLabel || "";
      profileImage = profile?.image || "";
      imageInput.value = "";
    }

    function resizeImage(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(new Error("画像を読み込めませんでした。"));
        reader.onload = () => {
          const image = new Image();
          image.onerror = () => reject(new Error("画像を開けませんでした。"));
          image.onload = () => {
            const scale = Math.min(1, 1000 / Math.max(image.naturalWidth, image.naturalHeight));
            const canvas = document.createElement("canvas");
            canvas.width = Math.max(1, Math.round(image.naturalWidth * scale));
            canvas.height = Math.max(1, Math.round(image.naturalHeight * scale));
            const context = canvas.getContext("2d");
            context.fillStyle = "#ffffff";
            context.fillRect(0, 0, canvas.width, canvas.height);
            context.drawImage(image, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL("image/jpeg", 0.82));
          };
          image.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }

    document.getElementById("editButton").addEventListener("click", () => {
      fillForm();
      form.hidden = false;
      showStatus("");
      document.getElementById("displayName").focus();
    });
    document.getElementById("cancelButton").addEventListener("click", () => {
      form.hidden = true;
      showStatus("");
    });
    document.getElementById("removeImageButton").addEventListener("click", () => {
      profileImage = "";
      imageInput.value = "";
      showStatus("画像を外しました。保存すると反映されます");
    });
    imageInput.addEventListener("change", async () => {
      const file = imageInput.files?.[0];
      if (!file) return;
      if (file.size > 20 * 1024 * 1024) {
        showStatus("20MB以下の画像を選択してください。", true);
        imageInput.value = "";
        return;
      }
      try {
        profileImage = await resizeImage(file);
        showStatus("画像を読み込みました");
      } catch (error) {
        showStatus(error.message, true);
      }
    });
    form.addEventListener("submit", event => {
      event.preventDefault();
      const name = document.getElementById("displayName").value.trim();
      const rawUrl = document.getElementById("profileUrl").value.trim();
      let url = "";
      if (rawUrl) {
        try {
          const parsed = new URL(rawUrl);
          if (parsed.protocol !== "https:" && parsed.protocol !== "http:") throw new Error("リンクはhttpまたはhttpsで入力してください");
          url = parsed.href;
        } catch (error) {
          showStatus(error.message === "Invalid URL" ? "リンクの形式を確認してください" : error.message, true);
          document.getElementById("profileUrl").focus();
          return;
        }
      }
      const nextProfile = {
        name,
        handle: document.getElementById("handle").value.trim(),
        introduction: document.getElementById("introduction").value.trim(),
        favorites: document.getElementById("favorites").value.trim(),
        playStyle: document.getElementById("playStyle").value.trim(),
        url,
        urlLabel: document.getElementById("profileUrlLabel").value.trim(),
        image: profileImage,
      };
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(nextProfile));
      } catch (error) {
        showStatus(`保存できませんでした: ${error.message}`, true);
        return;
      }
      profile = nextProfile;
      renderProfile();
      form.hidden = true;
      showStatus("プロフィールを保存しました");
    });

    renderProfile();
    if (!profile?.name) {
      fillForm();
      form.hidden = false;
    }
  </script>
</body>
</html>
